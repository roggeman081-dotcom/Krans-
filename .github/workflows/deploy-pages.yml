name: Deploy Kransbokning to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize synced files
        shell: python
        run: |
          import json
          from pathlib import Path

          changed = []
          skip_dirs = {".git", "node_modules"}
          for p in Path(".").rglob("*"):
              if not p.is_file() or any(part in skip_dirs for part in p.parts):
                  continue
              try:
                  raw = p.read_text(encoding="utf-8")
                  obj = json.loads(raw)
              except Exception:
                  continue
              if isinstance(obj, dict) and set(obj.keys()) == {"text"} and isinstance(obj["text"], str):
                  p.write_text(obj["text"], encoding="utf-8")
                  changed.append(str(p))
          print(f"Normalized {len(changed)} files")
          for p in changed:
              print(p)

      - name: Commit normalized files
        run: |
          if git diff --quiet; then
            echo "No normalization changes"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .
            git commit -m "Normalize synced Lovable files"
            git push
          fi

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
